<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" xmlns:th="http://www.thymeleaf.org">
    <title>Thêm course mới</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/CreateNew.css}"> </head>
</head>
<body>
<form th:action="@{/course/add}" th:object="${newCourse}" method="POST" enctype="multipart/form-data" class="course-form">

    <div class="form-group">
        <label class="form-label">Tên khóa học <span class="required-star">*</span></label>
        <input type="text" th:field="*{courseName}" required class="form-input">
        <small class="error-text">Độ dài từ 5 đến 100 ký tự.</small>
    </div>

    <div class="form-group">
        <label class="form-label">Giảng viên <span class="required-star">*</span></label>
        <input type="text" th:field="*{instructor}" required class="form-input">
    </div>

    <div class="form-group">
        <label class="form-label">Thời lượng (giờ) <span class="required-star">*</span></label>
        <input type="number" th:field="*{duration}" required class="form-input">
        <small class="help-text">Số nguyên dương (&gt;0) và &le; 500 giờ.</small>
    </div>

    <div class="form-group-last">
        <label class="form-label">Ảnh đại diện</label>
        <input type="file" name="imageFile" accept=".jpg, .jpeg, .png" class="form-input">
        <small class="help-text">Định dạng: .jpg, .png (Max 5MB)</small>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn-submit">Lưu</button>
        <a th:href="@{/course}" class="btn-cancel">Hủy</a>
    </div>
</form>
</body>
</html>
